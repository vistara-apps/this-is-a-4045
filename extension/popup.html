<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RedditScribe</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 320px;
      min-height: 400px;
      background: #0f0f23;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
    }

    .header {
      background: #1a1a3a;
      padding: 16px;
      border-bottom: 1px solid #10b981;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 16px;
    }

    .logo-icon {
      width: 24px;
      height: 24px;
      background: #10b981;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }

    .content {
      padding: 16px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      padding: 12px;
      background: #1a1a3a;
      border-radius: 6px;
    }

    .status-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
    }

    .status-indicator.active {
      background: #10b981;
    }

    .status-text {
      font-size: 13px;
      color: #a1a1aa;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .stat-card {
      background: #1a1a3a;
      padding: 12px;
      border-radius: 6px;
      text-align: center;
    }

    .stat-number {
      font-size: 20px;
      font-weight: 600;
      color: #10b981;
    }

    .stat-label {
      font-size: 11px;
      color: #a1a1aa;
      margin-top: 4px;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s ease;
      text-decoration: none;
      text-align: center;
      display: block;
    }

    .btn-primary {
      background: #10b981;
      color: white;
    }

    .btn-primary:hover {
      background: #059669;
    }

    .btn-secondary {
      background: #374151;
      color: #d1d5db;
      border: 1px solid #4b5563;
    }

    .btn-secondary:hover {
      background: #4b5563;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .recent-activity {
      margin-top: 16px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 600;
      color: #a1a1aa;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .activity-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      background: #1a1a3a;
      border-radius: 4px;
      margin-bottom: 4px;
      font-size: 12px;
    }

    .activity-icon {
      width: 16px;
      height: 16px;
      background: #10b981;
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
    }

    .activity-text {
      flex: 1;
      color: #d1d5db;
    }

    .activity-time {
      color: #71717a;
      font-size: 10px;
    }

    .footer {
      padding: 12px 16px;
      border-top: 1px solid #374151;
      background: #1a1a3a;
      margin-top: auto;
    }

    .footer-links {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
    }

    .footer-link {
      color: #a1a1aa;
      text-decoration: none;
    }

    .footer-link:hover {
      color: #10b981;
    }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid #374151;
      border-top: 2px solid #10b981;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <div class="logo-icon">📝</div>
      <span>RedditScribe</span>
    </div>
  </div>

  <div class="content">
    <div id="loading" class="loading">
      <div class="spinner"></div>
    </div>

    <div id="main-content" class="hidden">
      <div class="status">
        <div id="status-indicator" class="status-indicator"></div>
        <div class="status-text">
          <span id="status-text">Checking status...</span>
        </div>
      </div>

      <div class="stats">
        <div class="stat-card">
          <div id="compilations-count" class="stat-number">0</div>
          <div class="stat-label">Compilations</div>
        </div>
        <div class="stat-card">
          <div id="snippets-count" class="stat-number">0</div>
          <div class="stat-label">Snippets</div>
        </div>
      </div>

      <div class="actions">
        <button id="open-webapp" class="btn btn-primary">
          🚀 Open Web App
        </button>
        <button id="sync-data" class="btn btn-secondary">
          🔄 Sync Data
        </button>
        <button id="new-compilation" class="btn btn-secondary">
          ➕ New Compilation
        </button>
      </div>

      <div class="recent-activity">
        <div class="section-title">Recent Activity</div>
        <div id="activity-list">
          <!-- Activity items will be populated by JavaScript -->
        </div>
      </div>
    </div>
  </div>

  <div class="footer">
    <div class="footer-links">
      <a href="#" id="settings-link" class="footer-link">Settings</a>
      <a href="#" id="help-link" class="footer-link">Help</a>
      <a href="#" id="feedback-link" class="footer-link">Feedback</a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
